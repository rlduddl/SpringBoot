<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- th:text : ?띿뒪??異쒕젰 -->
	<title th:text="${title}"></title>
</head>
<body>
	<!-- th:utext : HTML ?쒓렇 ?ы븿 ?댁슜 異쒕젰 -->
	<div th:utext="${htmlTag}"></div>
	<!-- th: ?띿꽦?쇰줈 ??꾨━?꾩뿉??異쒕젰?섍쾶 吏??-->
	<input type="text" th:value="${title}" />
	<p th:text="${age}"></p>
	
	<!-- if else : if unless -->
	<p th:if="${age < 30}">30???댄븯</p>
	<p th:unless="${age < 30}">30???댁긽</p>
	
	<!-- Object 異쒕젰 -->
	<p th:text="${memberVO.userID}"></p>
	<p th:text="${memberVO.username}"></p>
	
	<!-- list 異쒕젰 -->
	<table>
		<tr th:each="memberVO : ${list}">
			<td th:text="|${memberVO.userID} : ${memberVO.username}|"></td>
			<td th:text="|?대쫫 : ${memberVO.username}|"></td>
		</tr>
	</table>
	
	<!-- a?쒓렇???뚮씪誘명꽣 ?쒓린 -->
	<div th:each="memberVO : ${list}">
		<a th:href="@{/member/info/{userID}(userID=${memberVO.userID})}">寃쎈줈 ?뚮씪誘명꽣</a>
	</div>
	
	<!-- ??: P?쒓렇???댁슜留?異쒕젰?섍퀬 ?띠???div ?쒓렇? 媛숈씠 萸붽? ?섎굹 ??媛먯떥怨??띠? ?딆? 寃쎌슦 -->
	<th:block th:utext="${htmlTag}"></th>
	
</body>
</html>
